{% load i18n %}
{# Row action menu on Allocate: Add/View note, and Edit Cost Item unless the row is a special-country lump sum. #}
<div class="analysis-table__actions-group">
    {% if cost_line_item.note %}
        <button type="button" aria-label="{% translate 'View Note' %}"
            class="analysis-table__action analysis-table__action--active analysis-table__category-edit analysis-table__category-edit--note">
            {% include 'icons/note-small.svg' %}
        </button>
    {% endif %}
    <div class="analysis-table__actions-menu">
        <button type="button"
                id="cost-line-item-actions-trigger-{{ cost_line_item.id }}"
                class="analysis-table__action analysis-table__actions-menu__trigger"
                popovertarget="cost-line-item-actions-{{ cost_line_item.id }}"
                aria-label="{% translate 'Cost item actions' %}">
            {% include 'icons/edit-small.svg' %}
        </button>
        <div id="cost-line-item-actions-{{ cost_line_item.id }}"
            popover="auto"
            anchor="cost-line-item-actions-trigger-{{ cost_line_item.id }}"
            class="analysis-table__actions-menu__popover">
            <button type="button"
                    class="analysis-table__actions-menu__item analysis-table__category-edit analysis-table__category-edit--note">
                {% if cost_line_item.note %}{% translate 'View note' %}{% else %}{% translate 'Add note' %}{% endif %}
            </button>
            {% if editable != 'false' and cost_item_edit_url %}
            <a href="{{ cost_item_edit_url }}{% if '?' in cost_item_edit_url %}&amp;{% else %}?{% endif %}cost_line_item_id={{ cost_line_item.pk }}"
            class="analysis-table__actions-menu__item"
            data-panels-trigger
            data-panels-reload-on="saved">
                {% translate 'Edit Cost Item' %}
            </a>
            {% endif %}
        </div>
    </div>
</div>
