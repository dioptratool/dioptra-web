{% load i18n %}
{# Floating "Report Issue" launcher for the Jira Service Management widget (js/report-issue.js); only rendered when settings.JSD_WIDGET_KEY is set. #}
{% if jsd_widget_key %}

<button type="button" class="report-issue" data-report-issue aria-label="{% translate 'Report Issue' %}">
    <svg class="report-issue__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3.1-1.3-.6V16A2.5 2.5 0 0 1 4 13.5v-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M12 6.5v4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="13.4" r="1.15" fill="currentColor"/>
    </svg>
    <span class="report-issue__label">{% translate 'Report Issue' %}</span>
</button>
<script data-jsd-embedded data-key="{{ jsd_widget_key }}" data-base-url="https://jsd-widget.atlassian.com" src="https://jsd-widget.atlassian.com/assets/embed.js"></script>
{% endif %}
