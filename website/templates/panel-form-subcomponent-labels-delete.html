{% extends 'html-panel.html' %}
{% load static %}

{% block panel-body %}
  <p class="delete-confirmation lead">
      Are you sure you want to delete the sub-component analysis? All
      work done in the analysis will be cleared.</p>
{% endblock panel-body %}

{% block panel-foot %}
<form method="post">
  {% csrf_token %}
    <button class="panels-delete-btn btn btn-danger" type="submit">Yes, delete</button>
    <a href="" data-panels-action="reject-close" class="btn btn-cancel">No, cancel</a>
</form>
{% endblock panel-foot %}
