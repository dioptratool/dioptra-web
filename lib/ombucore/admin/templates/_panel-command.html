{% load panels_extras %}
{{ payload|json_script:payload_script_id }}
<script type="text/javascript">
    $(function() {
        const payload = JSON.parse(document.getElementById("{{ payload_script_id|escapejs }}").textContent);
        const panelMethod = "{{ panel_method|escapejs }}";
        Panels.current[panelMethod](payload);
    });
</script>
